name: Build APK

# Сборка debug-APK Vellum. Запуск: Actions → Build APK → Run workflow.
# Артефакт называется vellum-debug.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vellum-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
